<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="WDD 131 - Dynamic Web Fundamentals - Christopher Osuna. This page showcases the siteplan for the WDD 131 course, including the structure and organization of the website.">
  <meta name="keywords" content="WDD 131, Dynamic Web Fundamentals, Christopher Osuna">
  <meta name="author" content="Christopher Osuna">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poiret+One&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/devcalm.css">
  <link rel="stylesheet" href="styles/devcalm_movil.css">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <script src="scripts/script.js" defer></script>
  <script src="scripts/resources.js" defer></script>
  <title>WebCalm</title>
</head>


<body>
  <header class="gradient-1">
    <div class="header">
      <img class="header-logo logo" src="images/logo.png" alt="DevCalm logo" width="200" height="55">
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="devcalm.html">DevCalm</a></li>
          <li><a href="timer.html">Timer</a></li>
          <li><a href="resources.html">Resources</a></li>
          <li>
            <input type="checkbox" id="dark-mode-toggle" class="dark-mode-toggle">
            <label for="dark-mode-toggle" class="dark-mode-label">
              <span class="visually-hidden">Dark mode</span>
            </label>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="resources container">
      <h1>Resources</h1>
      <div class="resources-list" id="mental-health-resources">
      </div>
    </section>

    <section class="contact-form container">
      <h2>Contact Us for More Info</h2>
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label for="interest">Interest:</label>
          <select id="interest" name="interest">
            <option value="general">General Information</option>
            <option value="timer">Timer Features</option>
            <option value="resources">More Resources</option>
            <option value="other">Other</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="4" required></textarea>
        </div>
        
        <div class="form-group">
          <button type="submit" class="cta-button">Send Message</button>
        </div>
      </form>
      
      <div id="formSuccess" class="success-message">
        Thank you! We've received your message and will contact you soon.
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-content container">
      <div class="footer-links-right">
        <ul class="footer-links">
          <li><a href="devcalm.html">DevCalm</a></li>
          <li><a href="timer.html">Timer</a></li>
          <li><a href="resources.html">Resources</a></li>
          <li><a href="attributions.html">Attributions</a></li>
        </ul>
      </div>
    </div>
    
    <div class="footer-bottom">
      <p>&copy;<span id="currentyear"></span> 🤖 Christopher Osuna, 🇲🇽 México</p>
      <p>Last modification: <span id="lastModified"></span></p>
    </div>
  </footer>
</body>
</html>
