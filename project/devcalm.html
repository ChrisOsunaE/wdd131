<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="WDD 131 - Dynamic Web Fundamentals - Christopher Osuna. This page showcases the siteplan for the WDD 131 course, including the structure and organization of the website.">
  <meta name="keywords" content="WDD 131, Dynamic Web Fundamentals, Christopher Osuna">
  <meta name="author" content="Christopher Osuna">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poiret+One&display=swap"
    rel="stylesheet">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <link rel="stylesheet" href="styles/devcalm.css">
  <link rel="stylesheet" href="styles/devcalm_movil.css">
  <script src="scripts/script.js" defer></script>
  <script src="scripts/devcalm.js" defer></script>
  <title>WebCalm</title>
</head>

<body>
  <header class="gradient-1">
    <div class="header">
      <img class="header-logo logo" src="images/logo.png" alt="DevCalm logo" width="200" height="55">
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="devcalm.html">DevCalm</a></li>
          <li><a href="timer.html">Timer</a></li>
          <li><a href="resources.html">Resources</a></li>
          <li>
            <input type="checkbox" id="dark-mode-toggle" class="dark-mode-toggle">
            <label for="dark-mode-toggle" class="dark-mode-label">
              <span class="visually-hidden">Dark mode</span>
            </label>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Debug Your Mind, Not Just Your Code</h1>
        <p>Tools for programers battling stress, burnout and RSI</p>
        <a href="timer.html" class="cta-button">Try the 5-min Rescue Timer</a>
      </div>
    </section>

    <section class="container">
      <h2>Statistics</h2>
      <div id="cards-container"></div>
    </section>
    
    <section class="container">
      <h2>Quick Desk Exercises</h2>
      <div class="gallery">
        <!-- Imágenes con lazy loading -->
        <figure class="gallery-item">
          <img src="images/wrist_relief_stretch.webp"  alt="Wrist stretch"  loading="lazy" class="lazy">
          <figcaption>Wrist Relief Stretch</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/neck_tension_release.webp" height="200" width="300" alt="Neck stretch" loading="lazy" class="lazy">
          <figcaption>Neck Tension Release</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/shoulder_rolls.webp" height="200" width="300" alt="Shoulder rolls" loading="lazy" class="lazy">
          <figcaption>Shoulder Rolls</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/upper_back_stretch.webp" height="200" width="300" alt="Upper back stretch" loading="lazy" class="lazy">
          <figcaption>Upper Back Stretch</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/eye_exercise.webp" height="200" width="300" alt="Eye exercise" loading="lazy" class="lazy">
          <figcaption>Eye Exercise</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/hand_stretch.webp" height="200" width="300" alt="Hand stretch" loading="lazy" class="lazy">
          <figcaption>Hand Stretch</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content container">
      <div class="footer-links-right">
        <ul class="footer-links">
          <li><a href="devcalm.html">DevCalm</a></li>
          <li><a href="timer.html">Timer</a></li>
          <li><a href="resources.html">Resources</a></li>
          <li><a href="attributions.html">Attributions</a></li>
        </ul>
      </div>
    </div>
    
    <div class="footer-bottom">
      <p>&copy;<span id="currentyear"></span> 🤖 Christopher Osuna, 🇲🇽 México</p>
      <p>Last modification: <span id="lastModified"></span></p>
    </div>
  </footer>
</body>
</html>
